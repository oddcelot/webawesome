name: Client Tests

on:
  workflow_dispatch:
  push:
    branches: [next]
  pull_request:
    branches: [next]

jobs:
  client_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 24.x
          cache: true

      - name: Check (format, lint, types)
        run: vp check

      - name: Build
        run: vp run build
        working-directory: ./packages/webawesome

      - name: Install Playwright
        run: vpx playwright install --with-deps
        working-directory: ./packages/webawesome

      - name: Run CSR tests
        run: FAIL_FAST="true" CSR_ONLY="true" vp run test
        working-directory: ./packages/webawesome
