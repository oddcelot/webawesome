# Fails if a component doc flags an anatomy example the diagram can't use (the flagged block lacks the
# component's tag, or the page has no diagram). Static analysis only — no build or dev server needed.

name: Anatomy

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:

jobs:
  anatomy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['24']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node-version }}
          version-file: packages/webawesome/package.json
          cache: true

      - name: Check anatomy examples
        run: vp run test:anatomy
        working-directory: ./packages/webawesome
