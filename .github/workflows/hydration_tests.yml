# Crawls every component docs page in SSR mode and fails if any page emits a
# `lit-hydration-error` event. SSR is only produced by the dev server's request
# middleware, so the dev server (`vp run start:docs`) must be running while we crawl.

name: Hydration Tests

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:

jobs:
  hydration_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['24']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node-version }}
          version-file: packages/webawesome/package.json
          cache: true

      - name: Install Playwright
        run: vpx playwright install --with-deps chromium
        working-directory: ./packages/webawesome

      # `vp run start:docs` builds, then serves with SSR on port 4000 and stays alive in
      # watch mode. Background it; check-hydration.js waits for it to come up.
      # Log to a file: once this step ends nothing reads its stdout, and the server can block writing to it
      # before it starts listening.
      - name: Start dev server
        run: vp run start:docs > "$RUNNER_TEMP/docs-server.log" 2>&1 &
        working-directory: ./packages/webawesome

      - name: Check docs pages for hydration errors
        run: vp run test:hydration
        env:
          # The dev server does a full build before it listens; give slow runners room.
          SERVER_TIMEOUT_MS: '600000'
        working-directory: ./packages/webawesome

      - name: Dev server log
        if: always()
        run: tail -n 100 "$RUNNER_TEMP/docs-server.log" || true
