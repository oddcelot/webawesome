# Fails if any component renders a `part="…"` attribute with no matching `@csspart`, or
# documents a `@csspart` that nothing renders, keeping the rendered and documented CSS part
# surfaces from drifting apart. Static analysis only — no build or dev server needed.

name: CSS Parts

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:

jobs:
  css_parts:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['24']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node-version }}
          version-file: packages/webawesome/package.json
          cache: true

      - name: Check CSS part coverage
        run: vp run test:parts
        working-directory: ./packages/webawesome
